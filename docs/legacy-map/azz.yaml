# TipTop → TTRS 資料對照：系統管理 (azz)
# 來源：tiptop/azz/4gl/p_zz.4gl、tiptop/azz/4fd/p_zz.4fd、tiptop/azz/sch/*.sch（資料表定義與欄位中文說明）
# 新表：migrations/0003_program_registry.sql 起；列舉欄位沿用 TipTop 代碼（'1'、'2'…）
# type：TipTop（Oracle）型別，取自 .sch；sch：.sch 的欄位說明（原文）
# verify: true 表示意義仍需確認；mismatch: true 表示與 TipTop 結構不同（已知差異）
# 長度：新系統依 .sch 的 varchar2 長度限制（以字元計），見 ttrs_domain::program::max_len、migrations/0007
# Genero 執行環境相關欄位（zz06/08/10/21/22/25/26/27）：Q1 已確認全部保留、原樣儲存不套規則

tables:
  - legacy: gao_file
    target: module
    scope: system
    note: 模組維護作業檔。TipTop p_zz 另有固定選項 MENU（不在 gao_file），SUB/CSUB/LIB/CLIB/QRY/CQRY 不可選
    columns:
      - { legacy: gao01, type: varchar2(10) NOT NULL, target: module_code, sch: 模組名稱（模組代號） }
      - { legacy: "(無)", target: name, note: "TTRS 新增的模組名稱（畫面顯示用）；gao_file 沒有名稱欄", verify: true, verify_note: "轉檔時模組名稱的來源待確認" }
    not_ported:
      - { legacy: gao02, type: varchar2(20), sch: 模組變數值, reason: "Genero 執行環境變數；TTRS 的執行指令沿用 p_zz 自動產生規則（代號前 3 碼），不讀此值" }
      - { legacy: gao03, type: varchar2(10), sch: 可執行程式路徑名稱, reason: "Genero 執行檔路徑" }
      - { legacy: gao04, type: varchar2(20), sch: 可執行程式放置路徑, reason: "Genero 執行檔路徑" }

  - legacy: gaw_file
    target: (尚未建表)
    note: 程式群組；gaw01 varchar2(10) 程式群組代碼、gaw02 varchar2(100) 說明。zz10 關連於 gaw01（尚未建表，zz10 目前不檢查存在）

  - legacy: zz_file
    target: program
    scope: system
    program: p_zz
    new_program: Program Maintenance（/azz/program-maintenance）
    note: "程式資料檔（.sch：檔案名稱「程式資料檔」）；主鍵 zz01"
    query: "Q.查詢 CONSTRUCT 27 欄位（p_zz.4gl :286-290，zz04 除外）→ ttrs_app::program_query；QBE 語法 → ttrs_domain::qbe；排序 zz01 位元組順序（COLLATE \"C\"）"
    columns:
      - { legacy: "(無)", target: "version / created_at / updated_at", note: "TTRS 新增：版本號（樂觀鎖）、建立與最後修改時間到秒，由觸發器維護；異動記錄寫入 public.change_log（ADR 0012 第二階段，migration 0025）" }
      - { legacy: zz01,   type: varchar2(20) NOT NULL, target: program_no, sch: 程式代號, note: "程式代號（鍵值，不可重複）；上限 20 字（PROGRAM_NO_TOO_LONG）" }
      - { legacy: zz011,  type: varchar2(10), target: module_code, sch: 模組代碼, note: "所屬模組；選項來自 gao_file，排除 SUB/CSUB/LIB/CLIB/QRY/CQRY，另加 MENU" }
      - { legacy: zz03,   type: varchar2(1), target: program_type, sch: "程式類別 M目錄 F建檔 T異動 P處理 R報表（.sch 說明較舊）", note: "4fd 選項 I輸入 M選單 O其他 P批次 Q查詢 R報表 S參數 T交易 U更新；a 開頭 7 碼代號取第 4 碼" }
      - { legacy: zz04,   type: varchar2(3000), target: default_actions, sch: "基本提供執行功能，Ex:AQURCOB（A輸入 Q查詢 U更改 R取消 C複製 O印表 B單身）", note: "逗號分隔的 action id 清單（p_zy Y1 確認）；新增權限時帶入 zy03 允許執行功能" }
      - { legacy: zz05,   type: varchar2(1), target: print_conditions, sch: "列印選擇條件否：僅對報表有效，Y 則於報表結束時列印 QBE 選擇條件", note: "新增預設 N（:790）；0007 由 print_option 更名" }
      - { legacy: zz06,   type: varchar2(1), target: report_ext_mode, sch: "報表檔附加檔名 (1).out (2)變動（變動為列印次數）", note: "新增預設 1（:791）" }
      - { legacy: zz07,   type: number(5), target: deferred_print_count, sch: "延後列印次數：延後列印時作為執行檔附加檔名並自動更新", note: 新增時預設 0 }
      - { legacy: zz08,   type: varchar2(60), target: run_command, sch: "UNIX 系統執行指令，例 fglgo $SYS/4gi/progcode", note: "含 p_query 者須有 zai_file 查詢定義（:973-982）；新增時 a 開頭 7 碼且未輸入者自動產生 $FGLRUN $<代號前 3 碼>i/<代號>（:917-926）；複製時重產為 $FGLRUN $<模組>i/<新代號>（:2045-2049）；僅採 Unix 格式" }
      - { legacy: zz09,   type: date, target: designed_on, sch: 設計日期, note: 新增、複製時預設今天（:783、:2053） }
      - { legacy: zz10,   type: varchar2(10), target: program_group, sch: "程式類別-1：程式群組名稱，關連於 gaw01", note: "開窗 q_gaw；0005 由 print_setting 更名" }
      - { legacy: zz13,   type: varchar2(1), target: allow_key_update, sch: "可否於建檔作業更改索引欄位資料(KEY) Y/N，僅對建檔作業有效", note: "新增預設 N（:784）。TipTop 的 update_user 會同步到 zy04，新系統未搬" }
      - { legacy: zz14,   type: varchar2(1), target: report_type, sch: 報表類型, note: "1憑證 2明細表 3統計表 4追蹤表 5無；必填；R 類不可為 5" }
      - { legacy: zz15,   type: varchar2(1), target: pass_book_no, sch: "是否傳遞帳別 Y/N（For agl system）", note: 僅 AGL/CGL/GGL/CGGL 模組適用 }
      - { legacy: zz16,   type: number(5), target: current_print_count, sch: "目前報表列印次數：列印時作為報表檔附加檔名並自動更新", note: "新增、沿用(controlo :1019)時歸 0；複製時原樣帶過（SELECT * :2042）" }
      - { legacy: zz17,   type: number(5), target: report_width, sch: "報表寬度 (79/132)", note: TipTop p_zz 自身報表以此取得列寬（:2352） }
      - { legacy: zz21,   type: varchar2(80), target: fixed_print_condition, sch: 固定列印條件, note: "0005 由 quick_run_data、0007 由 fixed_run_condition 更名" }
      - { legacy: zz22,   type: varchar2(1), target: fixed_print_method, sch: 固定列印方式, note: "0005 由 print_default、0007 由 print_method 更名" }
      - { legacy: zz25,   type: varchar2(1), target: sql_explain, sch: "Set explain on (Y/N)", note: "資料庫 SET EXPLAIN（SQL 執行計畫）開關；0007 由 help_enabled 更名" }
      - { legacy: zz26,   type: varchar2(1), target: log_errors, sch: 是否需要將錯誤訊息寫入記錄 }
      - { legacy: zz27,   type: varchar2(20), target: window_style, sch: "Windows Style：該程式需用到的 window style", note: "選項 sm1/sm2/sm3/popup/main/dialog/naked/viewer/report/err01/login/view/lib" }
      - { legacy: zz28,   type: varchar2(1), target: idle_control, sch: 處理閒置連線方式, note: "1不控制 2由程式設定 3依系統（預設 3）；必填" }
      - { legacy: zz29,   type: varchar2(1), target: idle_action, sch: 警告訊息, note: "1僅警告 2警告後關閉 3直接關閉；僅 zz28=2 時有值" }
      - { legacy: zz30,   type: number(5), target: idle_seconds, sch: 閒置時間 (秒), note: 僅 zz28=2 時有值 }
      - { legacy: zz31,   type: varchar2(255), target: remark, sch: No Use, note: ".sch 標示 No Use，但 p_zz.4fd 用作「其他備註」（Other Memo）" }
      - { legacy: zz32,   type: varchar2(1), sch: No Use, note: "單身權限預設，新增時 '0'；MOD-B80235 後不再寫入 zy07；不搬" }
      - { legacy: zzuser, type: varchar2(10), target: created_by, sch: OWNER }
      - { legacy: zzgrup, type: varchar2(10), target: created_dept, sch: GROUP }
      - { legacy: zzmodu, type: varchar2(10), target: updated_by, sch: MODIFY USER, note: 修改時帶目前使用者（MOD-B50035） }
      - { legacy: zzdate, type: date, target: updated_on, sch: MODIFY DATE, note: 新增、修改、改代號、複製時帶今天 }
    not_ported:   # 依 MOD-4B0066、MOD-4B0183
      - { legacy: zz02,  type: varchar2(80), sch: No Use, reason: 未使用 }
      - { legacy: zz02e, type: varchar2(40), sch: No Use, reason: 未使用 }
      - { legacy: zz02c, type: varchar2(40), sch: No Use, reason: 未使用 }
      - { legacy: zz11,  type: varchar2(4), sch: 程式類別-2, reason: Genero 版不使用 }
      - { legacy: zz12,  type: varchar2(4), sch: 程式類別-3, reason: Genero 版不使用 }
      - { legacy: zz18,  type: varchar2(1), sch: 基本使用者資料權限, reason: "Genero 版停用；新權限資料權限預設 0（p_zy Y3）" }
      - { legacy: zz19,  type: varchar2(1), sch: 基本部門資料權限, reason: "Genero 版停用；同 zz18" }
      - { legacy: zz23,  type: varchar2(1), sch: ISOLATION Mode, reason: Genero 版不使用 }
      - { legacy: zz24,  type: varchar2(1), sch: Default Wait seconds (0-9), reason: Genero 版不使用 }

  - legacy: gaz_file
    target: program_name
    scope: system
    note: "程式名稱多語言記錄檔；主鍵 (gaz01, gaz02, gaz05)。顯示時該語系無名稱退回繁中（L2）"
    columns:
      - { legacy: gaz01, type: varchar2(20) NOT NULL, target: program_no, sch: 程式代碼 }
      - { legacy: gaz02, type: varchar2(1) NOT NULL, target: lang, sch: 語言別, note: "0→zh-TW、1→en、2→zh-CN（L5、ADR 0005）" }
      - { legacy: gaz03, type: varchar2(500), target: name, sch: 程式名稱 }
      - { legacy: gaz06, type: varchar2(255), target: report_title, sch: 報表列印抬頭 }
    not_ported:
      - { legacy: gaz04, type: varchar2(4000), sch: 作業目的, reason: "由 p_purpose 維護、p_help 顯示的作業說明；TTRS 尚未移植說明功能，屆時再加" }
      - { legacy: gaz05, type: varchar2(1) NOT NULL, sch: 客製碼, reason: "TTRS 每個語系只有一個名稱；轉檔時客製（Y）優先" }
      - { legacy: "gazuser / gazgrup / gazmodu / gazdate", sch: "Create User / Modify Group / Modify User / Modify Date", reason: "名稱不另記建立與修改者；程式本身有修改者與修改日（zzmodu、zzdate）" }

  - legacy: zy_file
    target: program_permission
    scope: system
    program: p_zy（Program Permission Maintenance 程式執行權限維護）
    spec: specs/features/azz/program_permission_maintenance.feature
    query: "Q.查詢 CONSTRUCT zy01＋zy02/03/04/05/07（p_zy.4gl:154）→ ttrs_app::query::program_permission；specs/features/azz/program_permission_maintenance_query.feature（YQ1–YQ5）。只有單頭條件時含沒有程式權限的權限類別（YQ2，TipTop 查不到）；單身只顯示符合條件的程式（YQ3）；zy03 逐一比對每個功能（YQ4，TipTop 比對整串文字）"
    note: "權限類別＋程式一筆，有此筆才可執行該程式；資料權限的實際檢查見 ADR 0006（Authorizer）"
    authorization: "執行時的檢查 → ttrs_app::authorization（Authorizer），規格 specs/features/azz/authorization.feature（AQ1–AQ13）：
      zy03 功能不在清單拒絕（cl_chk_act_auth.4gl:77-93，不分大小寫）；zy04/zy05 用在 modify・detail・delete 的資料所有者／所有部門檢查
      （:97-122，只套用在 TipTop 有設定資料所有者的 p_zx、p_zz，AQ5）與查詢範圍（4 只查自己／自己部門，5–8 只查相關部門，p_zx.4gl:194-204）；
      zy05 5–8 修改刪除也要求部門在相關部門內，p_zyw 移植前相關部門只有自己的部門（AQ6）；zy07 用在 p_zw、p_zy、p_zxw 的單身新增列／刪除列
      （cl_detail_input_auth，AQ8）。拒絕回 PERMISSION_DENIED（403）。起始資料：migrations/0015 登錄已移植作業並給 ADMIN 全部功能（AQ11）"
    columns:
      - { legacy: "(無)", target: "version / created_at / updated_at", note: "TTRS 新增：版本號（樂觀鎖）、建立與最後修改時間到秒，由觸發器維護；異動記錄寫入 public.change_log（ADR 0012 第二階段，migration 0025）" }
      - { legacy: zy01,   type: varchar2(10) NOT NULL, target: class_code, sch: 權限類別 }
      - { legacy: zy02,   type: varchar2(20) NOT NULL, target: program_no, sch: 程式代號, note: "選單程式不設定（Y6）" }
      - { legacy: zy03,   type: varchar2(3000), target: actions, sch: "允許執行功能（Ex:AURQCOB）", note: "Genero 版實存逗號分隔的 action id；轉為 text[]，去空白、轉小寫、去重複，只能取自 zz04（Y1）" }
      - { legacy: zy04,   type: varchar2(1), target: other_user_data, sch: 使用者資料權限, note: "沿用代碼 0–4（Y4）" }
      - { legacy: zy05,   type: varchar2(1), target: other_dept_data, sch: 部門資料權限, note: "沿用代碼 0–8；5–8 相關部門待 p_zyw（Y4）" }
      - { legacy: zy07,   type: varchar2(1), target: detail_rows, sch: 程式單身處理權限, note: "沿用代碼 0–3（Y4）" }
      - { legacy: zyuser, type: varchar2(10), target: created_by, sch: OWNER, note: "TipTop 修改時也覆寫為修改者（MOD-970066）；新系統只在新增時寫入" }
      - { legacy: zygrup, type: varchar2(10), target: created_dept, sch: GROUP }
      - { legacy: zymodu, type: varchar2(10), target: updated_by, sch: USER }
      - { legacy: zydate, type: date, target: "created_on / updated_on", sch: MODIFY DATE, note: "TipTop 新增與修改共用；轉入時同時填 created_on" }
    not_ported:
      - { legacy: zy06, type: varchar2(20), sch: 使用者允許印表方式, reason: "TipTop FUN-5C0057 已取消（cl_prt.4gl:2390 Crystal Reports 匯出仍讀取）；TTRS 以功能代號 output／exporttoexcel 控管列印與匯出（ADR 0011 RP9、RP11）", verify: true, verify_note: "請確認 TOPPROD 是否仍使用 zy06" }
      - { legacy: "gap_file / gbd_file", reason: "程式動作關係與動作多語名稱；常見動作由 TTRS 翻譯（Y2）" }
      - { legacy: "gbl_file（p_auth_as 權限加嚴控管設定）", reason: "自訂動作比照 query/modify/delete 檢查資料權限；這次不做，沒有對應時自訂動作不檢查資料權限（同 TipTop 查無 gbl 資料，authorization.feature AQ7）", verify: true, verify_note: "請 DBA 確認 TOPPROD 的 gbl_file 是否有 p_zx、p_zz 的資料（如 invalid、authorization 比照 M）；有的話需提前移植" }

  - legacy: zw_file
    target: permission_class
    scope: system
    program: p_zw（Permission Class Maintenance 權限類別維護）
    spec: specs/features/azz/permission_class_maintenance.feature
    query: "Q.查詢 CONSTRUCT zw01–zw06、zwacti（p_zw.4gl:192）→ ttrs_app::query::permission_class；specs/features/azz/permission_class_maintenance_query.feature（WQ1–WQ4）。zw04/zw05 可輸入代碼或顯示文字"
    note: "權限類別；新增時不自動加入 TipTop 基本程式權限（W8）"
    columns:
      - { legacy: "(無)", target: "version / created_at / updated_at", note: "TTRS 新增：版本號（樂觀鎖）、建立與最後修改時間到秒，由觸發器維護；異動記錄寫入 public.change_log（ADR 0012 第二階段，migration 0025）" }
      - { legacy: zw01,   type: varchar2(10) NOT NULL, target: class_code, sch: 權限類別, note: "建立後不可修改（W1）" }
      - { legacy: zw02,   type: varchar2(80), target: name, sch: 權限說明, note: "新系統必填（W2）、不做多語言（W3）" }
      - { legacy: zw03,   type: varchar2(10), target: default_menu, sch: 使用目錄編號, note: "模組 MENU 的程式（W4）；使用者選單空白時帶入" }
      - { legacy: zw04,   type: varchar2(1), target: idle_control, sch: "test", note: ".sch 說明為 test；依 p_zw.4fd 為閒置設定 1 不控制、2 依權限類別、3 依系統（W5）" }
      - { legacy: zw05,   type: varchar2(1), target: idle_action, sch: 閒置處理, note: "1 僅警告、2 警告後關閉、3 直接關閉；只有 zw04 = 2 時保留" }
      - { legacy: zw06,   type: number(5), target: idle_seconds, sch: "閒置時間(秒)", note: "1–99999；只有 zw04 = 2 時保留" }
      - { legacy: zwacti, type: varchar2(1), target: active, sch: Active flag, note: "Y/N → true/false" }
      - { legacy: zwuser, type: varchar2(10), target: created_by, sch: OWNER, note: "TipTop p_zw 從未寫入，轉入時空白（W10）" }
      - { legacy: zwgrup, type: varchar2(10), target: created_dept, sch: GROUP, note: "同上" }
      - { legacy: zwmodu, type: varchar2(10), target: updated_by, sch: MODIFY USER }
      - { legacy: zwdate, type: date, target: updated_on, sch: MODIFY DATE }
    not_ported:
      - "基本程式權限自動加入與「新增基本程式權限」（p_zw.4gl:96-108、333-343、970-999；W8）"
      - "報表輸出 p_query、匯出 Excel（共用功能後續提供）"

  - legacy: zx_file
    target: user_account
    scope: system
    program: p_zx（User Maintenance 使用者維護）
    spec: specs/features/azz/user_maintenance.feature
    query: "Q.查詢 CONSTRUCT 19 欄位（p_zx.4gl:118-121）中有對應的 15 欄＋公司帳號 → ttrs_app::query::user；specs/features/azz/user_maintenance_query.feature（UQ1–UQ5）。zx11/zx12/zx15/zx19 不移植不可查；zx03、zx08 條件轉大寫、公司帳號轉小寫；資料權限條件（p_zx.4gl:194-204）待 Authorizer（UQ4）"
    note: "部門使用者檔；以使用者代號＋Web 密碼登入（ADR 0009，取代 ADR 0006 的公司 SSO）；忘記密碼的重設連結寄到 zx09（ADR 0010）"
    columns:
      - { legacy: "(無)", target: "version / created_at / updated_at", note: "TTRS 新增：版本號（樂觀鎖）、建立與最後修改時間到秒，由觸發器維護；異動記錄寫入 public.change_log（ADR 0012 第二階段，migration 0025）" }
      - { legacy: zx01,   type: varchar2(10) NOT NULL, target: user_id, sch: 使用者代號, note: "各表 created_by 存此值；建立後不可修改（U1）" }
      - { legacy: zx02,   type: varchar2(80), target: name, sch: 使用者名稱, note: "不做多語言（U5）" }
      - { legacy: zx03,   type: varchar2(10), target: dept_code, sch: 部門代號, note: "須為預設營運中心（zx08）存在且有效的部門 department.dept_code（user_maintenance_department.feature UD1–UD2；TipTop 只警告，FUN-830081）" }
      - { legacy: zx04,   type: varchar2(10), target: class_code, sch: 權限類別 }
      - { legacy: zx05,   type: varchar2(10), target: menu_program, sch: 自定目錄編號, note: "須為模組 MENU 的程式" }
      - { legacy: zx06,   type: varchar2(1), target: lang, sch: 使用語言別, note: "0→zh-TW、1→en、2→zh-CN（U6）" }
      - { legacy: zx07,   type: varchar2(1), target: multi_plant, sch: 是否為多營運中心使用者, note: "Y/N → boolean" }
      - { legacy: zx08,   type: varchar2(10), target: default_plant, sch: 預設營運中心編號 }
