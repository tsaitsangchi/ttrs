# TipTop 程式代號 → TTRS 英文程式代號（docs/adr/0008-english-program-codes.md）
# TTRS 的程式鍵值（program.program_no）是英文代號；TipTop 代號存 program.tiptop_program_no，只用於轉檔與對照。
# 格式：小寫英文、數字與連字號，英文字母開頭，最多 40 字（E1）。移植新作業時在此加一列，並在規格檔頭註明。
# 轉檔：zz_file 只轉入此表有的程式；zy_file、zxw_file、zm_file 依此表對照，對照不到的列不轉入並列出清單（E4）。

programs:
  - { tiptop: p_zz,    english: program-maintenance,            spec: specs/features/azz/program_maintenance.feature }
  - { tiptop: p_zta,   english: data-dictionary,                spec: specs/features/azz/data_dictionary.feature }
  - { tiptop: p_zx,    english: user-maintenance,               spec: specs/features/azz/user_maintenance.feature }
  # p_zxy 使用者資料庫權限設定：併入使用者維護的可使用營運中心勾選清單，權限同使用者維護的 modify（PZ2）
  - { tiptop: p_zxy,   english: user-maintenance,               spec: specs/features/azz/user_maintenance_plants.feature, registered: false }
  - { tiptop: p_zxw,   english: user-permission-maintenance,    spec: specs/features/azz/user_permission_maintenance.feature }
  - { tiptop: p_zw,    english: permission-class-maintenance,   spec: specs/features/azz/permission_class_maintenance.feature }
  - { tiptop: p_zy,    english: program-permission-maintenance, spec: specs/features/azz/program_permission_maintenance.feature }
  - { tiptop: aooi901, english: plant-maintenance,              spec: specs/features/aoo/plant_maintenance.feature }
  - { tiptop: aooi030, english: department-maintenance,         spec: specs/features/aoo/department_maintenance.feature }
  - { tiptop: aooi040, english: employee-maintenance,           spec: specs/features/aoo/employee_maintenance.feature }
  # aooi300 分類碼共用程式：TTRS 一支作業以類別切換（CC1）；aooi305、aooi309–aooi312 為 TipTop 選單上帶入類別的代號
  - { tiptop: aooi300, english: classification-code-maintenance, spec: specs/features/aoo/classification_code.feature }
  - { tiptop: aooi305, english: classification-code-maintenance, spec: specs/features/aoo/classification_code.feature, registered: false }
  - { tiptop: aooi309, english: classification-code-maintenance, spec: specs/features/aoo/classification_code.feature, registered: false }
  - { tiptop: aooi310, english: classification-code-maintenance, spec: specs/features/aoo/classification_code.feature, registered: false }
  - { tiptop: aooi311, english: classification-code-maintenance, spec: specs/features/aoo/classification_code.feature, registered: false }
  - { tiptop: aooi312, english: classification-code-maintenance, spec: specs/features/aoo/classification_code.feature, registered: false }
  - { tiptop: aimi100, english: item-maintenance,               spec: specs/features/aim/item_master.feature }
  # 登入與切換營運中心：每個已註冊使用者都能用，不登錄為程式、不檢查程式執行權限（sign_in.feature SQ9）
  - { tiptop: weblogin, english: sign-in,                       spec: specs/features/azz/sign_in.feature, registered: false }
  - { tiptop: aoos901,  english: switch-plant,                  spec: specs/features/azz/sign_in.feature, registered: false }
  # TTRS 新增、TipTop 無對應程式（ADR 0010）：忘記密碼登錄為程式但不給權限（登入前使用，R10）；
  # ttrs-admin 是伺服器指令，不登錄為程式、沒有 HTTP API（R11）
  - { tiptop: ~,        english: forgot-password,               spec: specs/features/azz/password_reset.feature }
  - { tiptop: ~,        english: ttrs-admin,                    spec: specs/features/azz/emergency_password_reset.feature, registered: false }

# 選單程式（模組 MENU）：menu- 加原名轉成 kebab-case（E5），例如 menu_main → menu-main
