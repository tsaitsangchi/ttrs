    spec: specs/features/aim/inventory_parameters.feature
    note: "每個營運中心一筆（IP2）；本批只移植 asms230 的 10 個參數，其他欄位屬於其他 asms 參數作業，移植時再加欄位（IP10）"
    columns:
      - { legacy: sma00, type: "varchar2(1)   PK NOT NULL", target: parameter_key, sch: "KEY VALUE(0)", note: "每個工廠 schema 一筆，固定 0（IP10）" }
      - { legacy: sma39, type: "varchar2(1)", target: add_storage_freely, sch: "是否可不經由'倉儲基本資料維", note: "Y/N → boolean；與 sma24 的連動延到成本參數（IP8）" }
      - { legacy: sma42, type: "varchar2(1)", target: storage_control, sch: "料件存放位置管制方式", note: "1／2／3，預設 3（IP4）" }
      - { legacy: sma68, type: "number(9,4)", target: fast_turnover, sch: "快速移動料件週轉率", note: "0–100、不小於平速（IP5）" }
      - { legacy: sma69, type: "number(9,4)", target: average_turnover, sch: "平速移動件週轉率", note: "0–100（IP5）" }
      - { legacy: sma847, type: "varchar2(10)", target: "misc_issue_dept / misc_receipt_dept", sch: "第一碼雜發單是否要輸入部門", note: "第 1、2 碼 Y/N → boolean（IP8）" }
      - { legacy: sma88, type: "varchar2(1)", target: plant_transfer_same_no, sch: "兩階段營運中心調撥,撥出單號", note: "Y/N → boolean（IP7）" }
