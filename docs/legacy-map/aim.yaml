      - { legacy: ima18, type: number(15,3), sch: "單位重量", reason: "不在任何料件畫面（程式自動寫入、拋轉用或已不使用），隨寫入它的模組移植" }
      - { legacy: ima19, type: varchar2(4), sch: "保稅料件進出口分類統計用類", reason: "不在任何料件畫面（程式自動寫入、拋轉用或已不使用），隨寫入它的模組移植" }
      - { legacy: ima20, type: number(9,3), sch: "保稅料件年度盤差容許率", reason: "不在任何料件畫面（程式自動寫入、拋轉用或已不使用），隨寫入它的模組移植" }
