# TipTop → TTRS 資料對照：庫存管理 (aim)
# verify: true 表示欄位意義尚未依實際 TipTop 版本確認，請 Key User 或 DBA 核對後移除。

tables:
  - legacy: ima_file
    target: item
    scope: plant
    program: aimi100（Item Maintenance 料件基本資料維護；以客製 topcust/cim 為準）
    spec: specs/features/aim/item_maintenance.feature
    note: "料件主檔；工廠層（IM9）。第一階段欄位見規格（IM1、IM31）；以 migrations/plant/0008 擴充早期骨架的 item 表（IM10）；多語言品名、規格在 item_text（IM7）"
    columns:
      - { legacy: ima01, type: varchar2(40) PK NOT NULL, target: item_no, sch: "料件編號", note: "區分大小寫、最多 40 字（IM21）" }
      - { legacy: ima02, type: varchar2(120), target: name, sch: "品名", note: "TTRS 必填（IM22）；多語言見 item_text（IM7）", verify: true }
      - { legacy: ima021, type: varchar2(120), target: spec, sch: "規格", note: "多語言見 item_text（IM7）" }
      - { legacy: ima03, type: varchar2(20), target: catalog_ref, sch: "目錄參考號碼" }
      - { legacy: ima04, type: varchar2(255), target: drawing_no, sch: "工程圖號", note: "varchar2(255)" }
      - { legacy: ima05, type: varchar2(10), target: current_version, sch: "目前使用版本", note: "複製時清空" }
      - { legacy: ima06, type: varchar2(10), target: group_code, sch: "分群碼", note: "料件分群（item_group），須有效（IM26）" }
      - { legacy: ima07, type: varchar2(1), target: abc_code, sch: "ABC碼", note: "A/B/C" }
      - { legacy: ima08, type: varchar2(1), target: source_code, sch: "來源碼", note: "C/T/D/A/M/P/X/K/U/V/R/Z/S；MISC 料件一律 Z" }
      - { legacy: ima09, type: varchar2(10), target: other_group1, sch: "其他分群碼 一", note: "分類碼類別 D" }
      - { legacy: ima10, type: varchar2(10), target: other_group2, sch: "其他分群碼 二", note: "分類碼類別 E" }
      - { legacy: ima11, type: varchar2(10), target: other_group3, sch: "其他分群碼 三", note: "分類碼類別 F" }
      - { legacy: ima12, type: varchar2(10), target: other_group4, sch: "其他分群碼 四", note: "分類碼類別 G" }
      - { legacy: ima13, type: varchar2(40), target: configurable_item_no, sch: "規格組件料件編號", note: "來源碼非 T 時清空" }
      - { legacy: ima14, type: varchar2(1), target: engineering, sch: "是否為工程料件", note: "Y/N → boolean" }
      - { legacy: ima15, type: varchar2(1), target: bonded, sch: "保稅與否", note: "Y/N → boolean" }
      - { legacy: ima16, type: number(5), target: low_level_code, sch: "低階碼", note: "系統維護，新增 99（IM29）" }
      - { legacy: ima23, type: varchar2(10), target: stock_keeper, sch: "倉管員", note: "有效員工" }
      - { legacy: ima24, type: varchar2(1), target: inspection, sch: "檢驗碼", note: "Y/N → boolean" }
      - { legacy: ima25, type: varchar2(4), target: stock_unit, sch: "庫存單位", note: "必填、須為有效單位" }
      - { legacy: ima27, type: number(15,3), target: safety_stock, sch: "安全庫存量", note: "≥ 0" }
      - { legacy: ima271, type: number(15,3), target: max_stock_qty, sch: "最高儲存數量", note: "≥ 0" }
      - { legacy: ima28, type: number(15,3), target: safety_period, sch: "安全庫存期間", note: "≥ 0" }
      - { legacy: ima29, type: date, target: last_txn_on, sch: "最近異動日期", note: "唯讀" }
      - { legacy: ima30, type: date, target: last_count_on, sch: "最近盤點日期", note: "新增為今天，唯讀" }
      - { legacy: ima35, type: varchar2(10), target: warehouse, sch: "主要倉庫別", note: "須為有效倉庫（warehouse，WH9 mfg1100）；修改時只檢查有變動的欄位" }
      - { legacy: ima36, type: varchar2(10), target: location, sch: "主要儲位別", note: "須為主要倉庫的儲位（warehouse_location，WH9 mfg1101）；只填儲位不填倉庫時擋下" }
      - { legacy: ima37, type: varchar2(1), target: replenish_policy, sch: "補貨策略碼", note: "0–5（IM23）；0、5 只限來源碼 M S P V Z" }
      - { legacy: ima39, type: varchar2(24), target: account, sch: "料件所屬會計科目", note: "會計科目未移植，先存代碼不檢查", verify: true }
      - { legacy: ima51, type: number(15,3), target: economic_order_qty, sch: "經濟訂購量", note: "> 0，預設 1" }
      - { legacy: ima52, type: number(15,3), target: average_order_qty, sch: "平均訂購量", note: "> 0，預設 1" }
      - { legacy: ima70, type: varchar2(1), target: consumable, sch: "消秏料件", note: "Y/N → boolean" }
      - { legacy: ima71, type: number(5), target: shelf_life_days, sch: "儲存有效天數", note: "≥ 0" }
      - { legacy: ima73, type: date, target: last_received_on, sch: "最近入庫日", note: "唯讀" }
      - { legacy: ima74, type: date, target: last_issued_on, sch: "最近出庫日", note: "唯讀" }
      - { legacy: ima881, type: date, target: last_period_purchase_on, sch: "期間採購最近採購日期", note: "唯讀" }
      - { legacy: ima93, type: varchar2(8), target: new_part_status, sch: "新料件處理狀況", note: "8 碼 Y/N 旗標，系統維護（IM29）" }
      - { legacy: ima105, type: varchar2(1), target: software, sch: "是否為軟體物件", note: "Y/N → boolean" }
      - { legacy: ima107, type: varchar2(1), target: insert_position, sch: "插件位置", note: "Y/N → boolean" }
      - { legacy: ima109, type: varchar2(10), target: material_category, sch: "材料類別", note: "分類碼類別 8" }
      - { legacy: ima131, type: varchar2(10), target: product_class, sch: "產品分類編號", note: "客製必填（aim-372）" }
      - { legacy: ima140, type: varchar2(1), target: phase_out, sch: "Phase Out 否", note: "Y/N → boolean" }
      - { legacy: ima146, type: varchar2(1), target: bom_changed, sch: "BOM異動否", note: "系統維護，唯讀（IM29）" }
      - { legacy: ima147, type: varchar2(1), target: insert_qpa_check, sch: "插件位置與QPA是否要勾稽", note: "Y/N → boolean" }
      - { legacy: ima901, type: date, target: item_created_on, sch: "料件建檔日期", note: "建檔日；新增與複製為今天", verify: true }
      - { legacy: ima902, type: date, target: slow_moving_on, sch: "呆滯日期", note: "呆滯日期，唯讀" }
      - { legacy: ima903, type: varchar2(1), target: coproduct, sch: "可否做聯產品入庫", note: "Y/N；來源碼非 M、T 時為否" }
      - { legacy: ima905, type: varchar2(1), target: coproduct_this_month, sch: "當月是否入聯產品", note: "系統維護，唯讀（IM29）" }
      - { legacy: ima906, type: varchar2(1), target: unit_usage, sch: "單位使用方式", note: "固定 1 單一單位（IM14）" }
      - { legacy: ima907, type: varchar2(4), target: second_unit, sch: "第二單位(母單位/參考單位)", note: "保留，不檢查換算（IM14）" }
      - { legacy: ima908, type: varchar2(4), target: pricing_unit, sch: "計價單位", note: "保留，不檢查換算（IM14）" }
      - { legacy: imaacti, type: varchar2(1), target: active_code, sch: "資料有效碼", note: "P 處理中／Y 已確認／N 無效（IM27）；TTRS active＝active_code≠N" }
      - { legacy: imauser, type: varchar2(10), target: created_by, sch: "資料所有者" }
      - { legacy: imagrup, type: varchar2(10), target: created_dept, sch: "資料所有群" }
      - { legacy: imamodu, type: varchar2(10), target: updated_by, sch: "資料更改者" }
      - { legacy: imadate, type: date, target: "created_on / updated_on", sch: "最近修改日", note: "TipTop 新增與修改共用；轉入時同時寫入兩者", verify: true }
      - { legacy: ima1001, type: varchar2(100), target: full_name, sch: "中文名稱(全稱)", note: "中文名稱（全稱）" }
      - { legacy: ima1002, type: varchar2(80), target: english_name, sch: "英文名稱", note: "英文名稱" }
      - { legacy: ima1010, type: varchar2(1), target: status_code, sch: "狀態碼", note: "0 開立／1 確認（IM27）" }
      - { legacy: ima1012, type: date, target: first_shipped_on, sch: "首次出貨日", note: "由出貨寫入，唯讀" }
      - { legacy: ima1013, type: date, target: first_received_on, sch: "首次入庫日", note: "由入庫寫入，唯讀" }
      - { legacy: ima1014, type: varchar2(1), target: life_cycle, sch: "產品週期狀態", note: "1–6（IM30）" }
      - { legacy: ima1015, type: date, target: planned_discontinue_on, sch: "預計停產日" }
      - { legacy: ima1016, type: varchar2(40), target: carton_barcode, sch: "箱條碼" }
      - { legacy: ima911, type: varchar2(1), target: repetitive, sch: "是否為重覆性生產料件 (Y/N)", note: "Y/N → boolean" }
      - { legacy: ima391, type: varchar2(24), target: account2, sch: "會計科目二", note: "會計科目未移植，先存代碼不檢查", verify: true }
      - { legacy: ima915, type: varchar2(1) NOT NULL, target: supplier_control, sch: "是否需做供應商的管制", note: "0 不管制／1 請購／2 採購／3 二者" }
      - { legacy: ima916, type: varchar2(10) NOT NULL, target: data_source, sch: "'  資料來源", note: "資料來源營運中心；新增時記目前營運中心，拋轉來的料件記來源營運中心（item_carry.feature IC6(c)）；依此判斷子公司可否修改、刪除（IC9）" }
      - { legacy: ta_ima01, type: varchar2(1), target: order_invalid, sch: "訂單無效否", note: "客製：訂單無效否，新增預設是（IM18）", verify: true }
      - { legacy: ta_ima02, type: varchar2(20), target: pcn, sch: "PCN", note: "客製：PCN", verify: true }
      - { legacy: ta_ima08, type: varchar2(10), target: apply_dept, sch: "申請部門", note: "客製：申請部門（department）", verify: true }
      - { legacy: "(無)", target: "version / created_at / updated_at", note: "TTRS 新增（ADR 0012 §1、§4）" }
