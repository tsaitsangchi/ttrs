  - legacy: gec_file
    target: tax_type
    scope: system
    scope_note: "TipTop 各營運中心資料庫各一份；TTRS 全公司共用（TX2），若各法人稅別不同再改為工廠層"
    program: aooi150（Tax Type Maintenance 稅別維護）
    spec: specs/features/aoo/tax_type_maintenance.feature
    columns:
      - { legacy: gec01,   type: varchar2(4) PK NOT NULL, target: tax_code, sch: 稅別碼, note: "區分大小寫、建立後不可修改（TX8）" }
      - { legacy: gec011,  type: varchar2(1) PK NOT NULL, target: direction, sch: 進/銷項, note: "1 進項、2 銷項" }
      - { legacy: gec02,   type: varchar2(80), target: name, sch: 稅別名稱, note: "不做多語言（TX8）" }
      - { legacy: gec03,   type: varchar2(24), target: account, sch: 會計科目編號, note: "會計科目移植前不檢查（TX4）；稅率不為 0 時必填" }
      - { legacy: gec031,  type: varchar2(24), target: account2, sch: 會計科目二, note: "第二帳套；不檢查（TX4）" }
      - { legacy: gec04,   type: number(9,4), target: rate, sch: 稅率, note: "numeric(9,4)，0–100，預設 0（TX5）；零稅率、免稅為 0" }
      - { legacy: gec05,   type: varchar2(1), target: invoice_copies, sch: 發票聯數, note: "台灣版 0／2／3／4／X（TX3）；大陸版值見 not_ported" }
      - { legacy: gec06,   type: varchar2(1), target: tax_class, sch: "1.應稅 2.零稅率 3.免稅" }
      - { legacy: gec07,   type: varchar2(1), target: include_tax, sch: 單價含稅否, note: "Y/N → boolean；二聯式（申報格式 28 除外）須含稅" }
      - { legacy: gec08,   type: varchar2(2), target: filing_format, sch: 媒體申報格式, note: "進項 21–29、銷項 31–38、XX；必填，預設 XX（TX6）" }
      - { legacy: gecacti, type: varchar2(1), target: active, sch: 資料有效碼, note: "Y/N → boolean" }
      - { legacy: gecuser, type: varchar2(10), target: created_by, sch: 資料所有者 }
      - { legacy: gecgrup, type: varchar2(10), target: created_dept, sch: 資料所有部門 }
      - { legacy: gecmodu, type: varchar2(10), target: updated_by, sch: 資料修改者 }
      - { legacy: gecdate, type: date, target: "created_on / updated_on", sch: 最近修改日, note: "TipTop 新增與修改共用；轉入時同時寫入兩者", verify: true }
      - { legacy: "(無)", target: "confirmed / confirmed_by / confirmed_at", note: "TTRS 標準確認欄位（ADR 0013 SA9）" }
      - { legacy: "(無)", target: "version / created_at / updated_at", note: "TTRS 新增（ADR 0012 §1、§4）" }
    not_ported:
      - { legacy: "gec05（A、B、C、G、N、S、T、W、Z）", type: varchar2(1), sch: 大陸版發票種類, reason: "只做台灣版（TX3）；轉入時若有大陸版值須先確認" }

  - legacy: gja_file
    target: project
    scope: plant
    scope_note: "工廠層（PJ2）：每個營運中心的 schema 各一份，與 TipTop 相同"
    program: aooi200（Project Maintenance 專案維護）
    spec: specs/features/aoo/project_maintenance.feature
    columns:
      - { legacy: gja01,   type: varchar2(10) PK NOT NULL, target: project_code, sch: 專案編號, note: "區分大小寫、建立後不可修改（PJ5）" }
      - { legacy: gja02,   type: varchar2(80), target: name, sch: 專案名稱, note: "不做多語言（PJ5）" }
      - { legacy: gja03,   type: date, target: start_on, sch: 專案起始日期, note: "可空白（PJ3）" }
      - { legacy: gja04,   type: date, target: end_on, sch: 專案結束日期, note: "可空白；不可早於起始日期（apj-018，PJ3）" }
      - { legacy: gjaacti, type: varchar2(1), target: active, sch: 資料有效碼, note: "Y/N → boolean" }
      - { legacy: gjauser, type: varchar2(10), target: created_by, sch: 資料所有者 }
      - { legacy: gjagrup, type: varchar2(10), target: created_dept, sch: 資料所有部門 }
      - { legacy: gjamodu, type: varchar2(10), target: updated_by, sch: 資料修改者 }
      - { legacy: gjadate, type: date, target: "created_on / updated_on", sch: 最近修改日, note: "TipTop 新增與修改共用；轉入時同時寫入兩者", verify: true }
      - { legacy: "(無)", target: "confirmed / confirmed_by / confirmed_at", note: "TTRS 標準確認欄位（ADR 0013 SA9）" }
      - { legacy: "(無)", target: "version / created_at / updated_at", note: "TTRS 新增（ADR 0012 §1、§4）" }
    not_ported:
      - { legacy: gja05, type: "number(15,2)", sch: No Use, reason: ".sch 標示未使用（PJ6）" }
      - { legacy: gja06, type: "number(15,2)", sch: No Use, reason: ".sch 標示未使用（PJ6）" }
      - { legacy: gja07, type: "number(15,2)", sch: No Use, reason: ".sch 標示未使用（PJ6）" }
      - { legacy: gja08, type: "number(15,2)", sch: No Use, reason: ".sch 標示未使用（PJ6）" }
