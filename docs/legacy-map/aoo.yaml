# TipTop → TTRS 資料對照：整體管理 (aoo)
# 來源：tiptop/aoo/4gl/aooi901.4gl、tiptop/aoo/4fd/aooi901.4fd、tiptop/aoo/sch/azp_file.sch（資料表定義與欄位中文說明）
# 新表：migrations/0001_init.sql、0012_plant.sql
# type：TipTop（Oracle）型別，取自 .sch；sch：.sch 的欄位說明（原文）
# verify: true 表示意義仍需確認；not_ported 列出不移植的欄位或功能與原因

tables:
  - legacy: azp_file
    target: plant
    scope: system
    scope_note: 營運中心本身在共用 schema；每廠的資料在 schema_name 指的工廠 schema（ADR 0007）
    program: aooi901（Plant Maintenance 營運中心維護）
    spec: specs/features/aoo/plant_maintenance.feature
    query: "Q.查詢 CONSTRUCT 10 欄位（aooi901.4gl:122-124）中有對應的 6 欄＋資料有效 → ttrs_app::query::plant；specs/features/aoo/plant_maintenance_query.feature（PQ1–PQ4）。azp04/053/20 不移植不可查；azp03 資料庫代碼可查（PQ5，條件轉小寫）；azp01 條件轉大寫；cl_qbe_select／cl_qbe_save（叫出／儲存查詢條件）為共用功能，後續提供"
    note: "TipTop 一個營運中心一個資料庫 schema；新系統同樣一廠一個 PostgreSQL schema（ds01…），營運中心本身登錄在共用 schema 的 plant（ADR 0007）"
    migration: "各營運中心的 Oracle schema 轉入 azp03 對應的工廠 schema（ADR 0007 §11）；azp03 由 TipTop 使用者維護成 ds 加兩位數字（Q16）"
    columns:
      - { legacy: "(無)", target: "version / created_at / updated_at", note: "TTRS 新增：版本號（樂觀鎖）、建立與最後修改時間到秒，由觸發器維護；異動記錄寫入 public.change_log（ADR 0012 第二階段，migration 0025）" }
      - { legacy: azp01,  type: varchar2(10) NOT NULL, target: plant_id, sch: 營運中心代碼, note: "轉大寫（P3）、建立後不可修改（P4）" }
      - { legacy: azp03,  type: varchar2(20), target: schema_name, sch: 資料庫代碼, note: "工廠 schema 名稱：ds 加兩位數字、小寫、不可重複、建立後不可修改；新增時自動給下一號（P13）。新增營運中心時建立 schema 與角色（P14），刪除時移除（P15）" }
      - { legacy: azp02,  type: varchar2(80), target: name, sch: 營運中心名稱, note: "新系統必填、不做多語言（P5）" }
      - { legacy: azp052, type: varchar2(80), target: time_zone, sch: 時區, note: "GMT 偏移改存 IANA 名稱（P6）；空白為 Asia/Taipei", verify: true, verify_note: "轉檔時 GMT±n 對應的城市清單需與 Key User 確認（如 GMT+8 → Asia/Taipei 或 Asia/Shanghai）" }
      - { legacy: azp051, type: varchar2(255), target: address, sch: 地址-1 }
      - { legacy: azp06,  type: varchar2(40), target: phone, sch: 營運中心電話 }
      - { legacy: azp07,  type: varchar2(40), target: fax, sch: 營運中心傳真 }
      - { legacy: "(無)", target: active, note: "TipTop 無有效欄位；轉入一律有效（P9）" }
      - { legacy: "(無)", target: "created_by / created_dept / created_on / updated_by / updated_on", note: "TipTop 無建立／修改資訊；轉入時空白（P12）" }
    not_ported:
      - { legacy: azp04,  type: varchar2(10), sch: "伺服器(SERVER)編號", reason: "Oracle DB link（P1）" }
      - { legacy: azp20,  type: varchar2(20), sch: SQL資料庫主機IP, reason: "MSSQL 連線（P1）" }
      - { legacy: azp053, type: varchar2(1), sch: ERP 資料庫否, reason: "TTRS 營運中心皆為 ERP 營運中心（P2）；值為 N 的資料不轉入", verify: true, verify_note: "請以正式區資料確認沒有實際營運中心為 N" }
      - { legacy: azp08,  type: varchar2(1), sch: No Use, reason: "未使用" }
      - { legacy: azp09,  type: varchar2(1), sch: 是否限制上線人數, reason: "上線人數控管改由 IdP／IT 政策（P8）" }
      - { legacy: azp10,  type: number(10), sch: 可上線人數, reason: "同 azp09（P8）" }
      - { legacy: "動作 connect_string / mntn_reportdb", reason: "資料庫連線字串維護（P1）" }

  - legacy: gbo_file
    target: "(不移植)"
    note: "部門可上線人數設定檔；aooi901 會同步調整上限（P8 不移植）"

  - legacy: zxx_file
    target: "(待營運中心切換)"
    note: "使用者目前使用的營運中心；ADR 0006 §5 營運中心切換時另行設計（web 存於 session）"

  - legacy: azf_file
    target: classification_code
    scope: plant
    program: aooi300（Classification Code Maintenance 分類碼維護；aooi305、aooi309–aooi312 帶入類別執行）；客製 aooi080 併入（OC3）
    spec: "specs/features/aoo/classification_code.feature、classification_code_other_kinds.feature"
    note: "分類碼；工廠層（CC8）。開放類別 8、D、E、F、G（CC2）與 2、6、A、R、S（OC1）；3、5、H、Z 不開放（OC2）"
    columns:
      - { legacy: azf01,   type: varchar2(10) NOT NULL, target: code, sch: 碼別代號, note: "同一類別內不可重複（-239）；不轉大寫" }
      - { legacy: azf02,   type: varchar2(1) NOT NULL, target: kind, sch: 碼類別, note: "8、D、E、F、G（CC2）；2、6、A、R、S（OC1）" }
      - { legacy: azf03,   type: varchar2(80), target: description, sch: 說明內容, note: "不做多語言（CC9）" }
      - { legacy: azf05,   type: varchar2(24), target: variance_account, sch: 存貨差異科目代號, note: "類別 G；會計科目未移植，暫不檢查（CC3）", verify: true }
      - { legacy: azf051,  type: varchar2(24), target: variance_account2, sch: 存貨差異科目代號二, note: "類別 G（兩套帳）", verify: true }
      - { legacy: azf06,   type: number(5), target: cost_nature, sch: 成本性質, note: "類別 G" }
      - { legacy: azfacti, type: varchar2(1), target: active, sch: 資料有效碼, note: "Y/N → boolean；新增預設有效" }
      - { legacy: azfuser, type: varchar2(10), target: created_by, sch: 原始資料建立者 }
      - { legacy: azfgrup, type: varchar2(10), target: created_dept, sch: 使用者部門 }
      - { legacy: azfmodu, type: varchar2(10), target: updated_by, sch: 最後修改資料者 }
      - { legacy: azfdate, type: date, target: "created_on / updated_on", sch: 最後修改日期, note: "TipTop 新增與修改共用；轉入時同時寫入兩者", verify: true }
      - { legacy: "(無)", target: "version / created_at / updated_at", note: "TTRS 新增：版本號（樂觀鎖）、建立與最後修改時間到秒，由觸發器維護（ADR 0012 §1、§4）；轉入時 version＝1、created_at＝轉檔時間、updated_at 空白" }
    not_ported:
      - { legacy: azf04,  type: number(5), sch: 保稅異動類別, reason: "兩支維護作業都沒有輸入；保稅模組移植時再決定（OC7）" }
      - { legacy: azf07,  type: varchar2(24), sch: 會計科目, reason: "只有類別 H（aooi313）使用，第一階段未開放" }
      - { legacy: azf08,  type: varchar2(1), sch: 是否列入銷售費用, reason: "只有類別 H 使用" }
      - { legacy: azf09,  type: varchar2(1), sch: 用途, reason: "只有類別 H 使用" }
      - { legacy: azf10,  type: varchar2(1), sch: 是否搭贈, reason: "只有類別 H 使用" }
      - { legacy: azf11,  type: varchar2(1), sch: 是否計算業績, reason: "只有類別 H 使用" }
      - { legacy: azf12,  type: varchar2(1), sch: 是否影響呆滯日期, reason: "只有類別 H 使用" }
      - { legacy: azf13,  type: varchar2(1), sch: 是否拒收, reason: "只有類別 H 使用" }
      - { legacy: azf14,  type: varchar2(24), sch: 銷售費用會計科目, reason: "只有類別 H 使用" }

  - legacy: gem_file
    target: department
    scope: plant
    program: aooi030（Department Maintenance 部門維護）
    spec: specs/features/aoo/department_maintenance.feature
    note: "部門名稱資料；工廠層，每廠的 schema 各一份（DQ1）。列印（output）與匯出 Excel（exporttoexcel）見 specs/features/aoo/department_report.feature"
    columns:
      - { legacy: gem01,   type: varchar2(10) NOT NULL, target: dept_code, sch: 部門編號, note: "轉大寫、建立後不可修改（DQ2）" }
      - { legacy: gem02,   type: varchar2(80), target: name, sch: 部門名稱, note: "簡稱；新系統必填" }
      - { legacy: gem03,   type: varchar2(80), target: full_name, sch: 部門全稱 }
      - { legacy: gem05,   type: varchar2(1), target: accounting_dept, sch: 是否為會計部門, note: "新增預設 Y" }
      - { legacy: gem07,   type: varchar2(1), target: expense_type, sch: 費用類別, note: "M 管理、P 製造、R 研發、S 銷售" }
      - { legacy: gem09,   type: varchar2(1), target: control_type, sch: 管理類別, note: "1 成本中心、2 利潤中心、3 其他；新增預設 3" }
      - { legacy: gem10,   type: varchar2(10), target: cost_center, sch: 對應成本中心, note: "管理類別 1、2 時必填，須為有效部門" }
      - { legacy: gemacti, type: varchar2(1), target: active, sch: 資料有效碼 }
      - { legacy: gemuser, type: varchar2(10), target: created_by, sch: 資料所有者 }
      - { legacy: gemgrup, type: varchar2(10), target: created_dept, sch: 資料所有部門 }
      - { legacy: gemmodu, type: varchar2(10), target: updated_by, sch: 資料修改者 }
      - { legacy: gemdate, type: date, target: updated_on, sch: 最近修改日 }
      - { legacy: "(無)", target: "version / created_at / updated_at", note: "TTRS 新增：版本號（樂觀鎖）、建立與最後修改時間到秒，由觸發器維護（ADR 0012 §1、§4）；轉入時 version＝1、created_at＝轉檔時間、updated_at 空白" }
    not_ported:
      - { legacy: gem04, type: varchar2(6), sch: No Use, reason: 未使用 }
      - { legacy: gem06, type: varchar2(1), sch: No Use, reason: 未使用 }
      - { legacy: gem08, type: varchar2(1), sch: No Use, reason: 未使用 }

