[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
argon2 = { version = "0.5.3", features = ["std"] }
getrandom = "0.3"
ttrs-shared = { path = "crates/shared" }
ttrs-domain = { path = "crates/domain" }
ttrs-app = { path = "crates/app" }
ttrs-infra = { path = "crates/infra" }

async-trait = "0.1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
# EPUB 轉 TXT（epub_to_text.feature ET8）
zip = { version = "2", default-features = false, features = ["deflate"] }
roxmltree = "0.20"
cucumber = "0.23"
dioxus = { version = "0.7.10", features = ["router"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "query"] }
rust_decimal = { version = "1.43", features = ["serde-with-str"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "chrono", "rust_decimal", "uuid"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower-http = { version = "0.7", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
float_arithmetic = "deny" # ERP 金額/數量一律用 rust_decimal

# 密碼雜湊（ADR 0009）：debug 版也最佳化，否則 BDD 每次雜湊要數秒
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
