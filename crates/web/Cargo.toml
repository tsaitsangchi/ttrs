[package]
name = "ttrs-web"
description = "Dioxus 前端：同一份程式碼輸出 Web / 桌面 / 行動版"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# 介面多語言（ADR 0005）：Fluent 翻譯檔
fluent-bundle = "0.16"
ttrs-shared.workspace = true
dioxus.workspace = true
reqwest.workspace = true
serde.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Location", "Storage", "Document", "Element"] }

[features]
default = ["web"]
web = ["dioxus/web"]
# 桌面版需要系統套件：sudo apt install libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]

[lints]
workspace = true
