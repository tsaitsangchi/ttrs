[package]
name = "ttrs-infra"
description = "基礎設施：PostgreSQL（SQLx）repository 實作與 migration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
chrono.workspace = true
rust_decimal.workspace = true
ttrs-domain.workspace = true
ttrs-app.workspace = true
async-trait.workspace = true
sqlx.workspace = true
serde_json.workspace = true
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "pool", "hostname", "tokio1-rustls-tls"] }
# 匯率自動匯入（台銀、關務署，IM1）：HTTPS 用 rustls＋ring（同 lettre），不另外編譯 aws-lc
reqwest = { workspace = true, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
typst-as-lib = "0.17"
typst = "0.15"
typst-pdf = "0.15"
rust_xlsxwriter = "0.102"
typst-layout = "0.15"
tokio.workspace = true

[lints]
workspace = true

[dev-dependencies]
tokio = { workspace = true }
