[package]
name = "ttrs-api"
description = "HTTP API（Axum）。Web、桌面、PDA 前端都透過此 API 存取。"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
default-run = "ttrs-api"
# 另有伺服器指令 ttrs-admin（src/bin），`cargo run -p ttrs-api` 預設執行 API

[dependencies]
ttrs-app = { workspace = true, features = ["memory"] }
ttrs-domain.workspace = true
ttrs-infra.workspace = true
ttrs-shared.workspace = true
axum.workspace = true
chrono.workspace = true
rust_decimal.workspace = true
getrandom.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
