# TTRS ERP — nginx 站台設定
# 安裝：複製到 /etc/nginx/conf.d/ttrs.conf（此檔位於 http {} 區塊內）
#       sudo nginx -t && sudo systemctl reload nginx
#
# 部署配置：
#   前端靜態檔：make bundle 產出 target/dx/ttrs-web/release/web/public/ → /srv/ttrs/web/
#   API：ttrs-api 監聽 127.0.0.1:3000（可多開 instance 加入 upstream）
#
# 需依環境修改的地方都標了「TODO」。

upstream ttrs_api {
    server 127.0.0.1:3000;
    # server 127.0.0.1:3001;   # 多 instance 時加入，nginx 會輪流分配
    keepalive 32;
}

# API 請求頻率限制（每個來源 IP）
limit_req_zone $binary_remote_addr zone=ttrs_api_rl:10m rate=30r/s;

# HTTP → HTTPS
server {
    listen 80;
    server_name erp.example.com;              # TODO: 改為實際網域
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name erp.example.com;              # TODO

    ssl_certificate     /etc/nginx/certs/ttrs.crt;   # TODO: 公司憑證
    ssl_certificate_key /etc/nginx/certs/ttrs.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # ERP 僅限內網時開啟
    # allow 10.0.0.0/8;
    # allow 192.168.0.0/16;
    # deny all;

    access_log /var/log/nginx/ttrs.access.log;
    error_log  /var/log/nginx/ttrs.error.log;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 20m;                 # 附件、匯入檔上限

    # wasm 檔很大，壓縮效益高（有 brotli 模組可另外開 brotli on）
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;

    # 舊版 mime.types 沒有 wasm，瀏覽器會拒絕 streaming 編譯
    types {
        application/wasm wasm;
    }

    # --- API：轉給 Axum，同源所以不需要 CORS ---
    location /api/ {
        limit_req zone=ttrs_api_rl burst=60 nodelay;

        proxy_pass http://ttrs_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 月結、MRP 等長時間作業日後應改為背景工作；在那之前放寬逾時
        proxy_read_timeout 300s;
    }

    location = /health {
        proxy_pass http://ttrs_api;
        access_log off;
    }

    # --- 前端靜態檔 ---
    root /srv/ttrs/web;                       # TODO: 對應部署路徑

    # dx 輸出的資產檔名含 hash，可長期快取
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    location /wasm/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # SPA：所有前端路由（/aim/items…）都回 index.html；index.html 本身不快取
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
